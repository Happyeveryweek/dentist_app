name: dentist_app_windows
description: 牙医诊所管理系统 - Windows版本

# 应用版本
version: 1.0.0+1

environment:
  sdk: ">=2.17.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
    
  # 核心依赖
  provider: ^6.0.5
  sqflite: ^2.2.8+4
  sqflite_common_ffi: ^2.2.5
  shared_preferences: ^2.1.1
  path: ^1.8.3
  path_provider: ^2.1.5
  intl: ^0.19.0
  mysql1: ^0.20.0
  crypto: ^3.0.3
  
  # UI组件
  cupertino_icons: ^1.0.5
  flutter_spinkit: ^5.2.0
  file_picker: ^9.2.1
  font_awesome_flutter: ^10.4.0
  
  # 工具和实用程序
  equatable: ^2.0.5
  pdf: ^3.10.4
  printing: ^5.11.0
  url_launcher: ^6.1.11
  excel: ^4.0.6
  window_manager: ^0.4.3
  lpinyin: ^2.0.3
  calendar_date_picker2: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/

